map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API-Reverseproxy zum Backend (inkl. SSE und WebSocket)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;            # wichtig fuer SSE-Streams
        proxy_read_timeout 1h;          # WebSocket-Verbindungen offen halten
    }

    # SPA-Fallback: alle unbekannten Pfade auf index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Statische Assets aggressiv cachen (Vite-Hashes machen das sicher)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Standard-Sicherheitsheader
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
