services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fishingagend-backend-prod
    env_file: .env
    restart: unless-stopped
    environment:
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - ENTWICKLUNG=false
    expose:
      - "8000"
    volumes:
      - backend_daten:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/zustand')"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASIS: ${VITE_API_BASIS:-/api}
    container_name: fishingagend-frontend-prod
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  backend_daten:
