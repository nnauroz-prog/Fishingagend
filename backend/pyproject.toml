[project]
name = "fishingagend-backend"
version = "0.1.0"
description = "Multi-Agenten-KI-Vorhersage-Engine — Backend"
readme = "../README.md"
requires-python = ">=3.11,<3.13"
license = { text = "AGPL-3.0" }
authors = [{ name = "Fishingagend Contributors" }]

dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "anthropic>=0.40.0",
  "httpx>=0.27.0",
  "sqlalchemy>=2.0.30",
  "aiosqlite>=0.20.0",
  "python-multipart>=0.0.12",
  "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.7.0",
  "mypy>=1.13.0",
  "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = [
  "E501",  # Zeilenlänge
  "B008",  # Depends() im Default ist FastAPI-Standard
  "UP042", # str + Enum statt StrEnum (StrEnum erst ab 3.11)
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
