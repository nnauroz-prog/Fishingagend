name: CI

on:
  push:
    branches: [main, claude/general-session-utthR]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # Cache absichtlich aus, damit alte gehashte requirements.txt
          # nicht wiederverwendet werden.
      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio pytest-cov httpx
          pip list | grep -E "^(passlib|pyjwt|fastapi|httpx|pytest|ruff)" || true
      - name: Lint (Ruff)
        run: ruff check .
      - name: Imports validieren
        # Frueh erkennen, ob ein Modul nicht importierbar ist — gibt eine
        # eindeutige Fehlermeldung statt eines kryptischen Test-Crashes.
        run: |
          python -c "from app.main import app; print('main ok')"
          python -c "from app.dienste import auth_dienst; print('auth ok')"
      - name: Migrationen anwenden
        run: |
          mkdir -p data
          alembic upgrade head
      - name: Tests (pytest)
        run: pytest --cov=app --cov-report=term -ra

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Abhängigkeiten installieren
        run: npm install --no-audit --no-fund
      - name: Typprüfung
        run: npm run typecheck
      - name: Tests (Vitest)
        run: npm test
      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image bauen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: fishingagend:ci
          load: true
          # Cache aus, weil sich das Layout zu oft aendert
      - name: Container starten
        run: |
          docker run -d --name fishingagend -p 8000:8000 \
            -e DEMO_DATEN_EINSPIELEN=false \
            -e CORS_URSPRUENGE="*" \
            fishingagend:ci
      - name: Health-Check (bis 90 s warten)
        run: |
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:8000/api/zustand > /tmp/zustand.json 2>/dev/null; then
              echo "Health-Check ok nach $((i*2)) s:"
              cat /tmp/zustand.json
              exit 0
            fi
            sleep 2
          done
          echo "===== Container-Logs ====="
          docker logs fishingagend
          echo "===== curl -v ====="
          curl -v http://localhost:8000/api/zustand || true
          exit 1
