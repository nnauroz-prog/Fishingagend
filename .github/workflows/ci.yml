name: CI

on:
  push:
    branches: [main, claude/general-session-utthR]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Abhängigkeiten installieren
        run: |
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio pytest-cov httpx
      - name: Lint (Ruff)
        run: ruff check .
      - name: Migrationen anwenden
        run: |
          mkdir -p data
          pip install alembic
          alembic upgrade head
      - name: Tests (pytest)
        run: pytest --cov=app --cov-report=term

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Abhängigkeiten installieren
        run: npm install --no-audit --no-fund
      - name: Typprüfung
        run: npm run typecheck
      - name: Tests (Vitest)
        run: npm test
      - name: Build
        run: npm run build

  docker:
    # Smoke-Test, dass der Multi-Stage-Container baut, den HF Spaces und
    # Render im Produktions-Deploy nutzen. Fängt kaputte Frontend-/Backend-
    # Dockerfile-Kombinationen, bevor sie auf der Plattform fehlschlagen.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image bauen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: fishingagend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container kurz starten und Health-Check
        run: |
          docker run -d --name fishingagend -p 8000:8000 \
            -e DEMO_DATEN_EINSPIELEN=false \
            -e CORS_URSPRUENGE="*" \
            fishingagend:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/zustand > /tmp/zustand.json 2>/dev/null; then
              echo "Health-Check ok:"
              cat /tmp/zustand.json
              exit 0
            fi
            sleep 2
          done
          echo "Health-Check fehlgeschlagen — Logs:"
          docker logs fishingagend
          exit 1
